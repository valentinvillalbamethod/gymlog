<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GymLog</title>
<meta name="description" content="Registro personal de entrenamientos. Funciona 100% sin conexión.">
<meta name="theme-color" content="#0e0f13">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png"><!-- iOS no soporta SVG acá -->
<link rel="stylesheet" href="style.css">
</head>
<body>

<main id="main">

  <!-- TAB: Rutinas (inicio) -->
  <section id="tab-rutinas" class="tab active">
    <header class="apphead">
      <h1>GymLog</h1>
      <div id="home-last" class="muted small"></div>
    </header>
    <div id="backup-hint"></div>
    <div id="routines-list"></div>
    <button class="btn primary big wide" id="btn-new-routine" onclick="openEditor(null)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg> Nueva rutina</button>
  </section>

  <!-- TAB: Progreso -->
  <section id="tab-progreso" class="tab">
    <header class="apphead"><h1>Progreso</h1></header>
    <div id="prog-stats" class="statrow"></div>
    <div class="card calcard">
      <div class="calhead">
        <button class="btn icon" onclick="calMove(-1)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
        <div id="cal-title" class="caltitle"></div>
        <button class="btn icon" onclick="calMove(1)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
      </div>
      <div class="calgrid caldows"><span>L</span><span>M</span><span>X</span><span>J</span><span>V</span><span>S</span><span>D</span></div>
      <div id="cal-grid" class="calgrid"></div>
      <div id="day-detail"></div>
    </div>
    <h2>Por ejercicio</h2>
    <button class="btn ghost wide" onclick="pickExerciseProgress()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg> Ver progreso de un ejercicio</button>
    <h2>Volumen por rutina</h2>
    <div id="rvol-chips" class="chips"></div>
    <div id="rvol-chart"></div>
    <h2>Historial</h2>
    <div id="history-list"></div>
  </section>

  <!-- TAB: Ajustes -->
  <section id="tab-ajustes" class="tab">
    <header class="apphead"><h1>Ajustes</h1></header>
    <div id="settings-body"></div>
  </section>

</main>

<!-- Pantalla: editor de rutina -->
<section id="screen-editor" class="screen">
  <header class="screenhead">
    <button class="btn icon" onclick="closeEditor()"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <input id="ed-name" class="namein" placeholder="Nombre (ej: Rutina A)" maxlength="30">
    <button class="btn primary" onclick="saveEditor()">Guardar</button>
  </header>
  <div id="ed-body" class="screenbody"></div>
</section>

<!-- Pantalla: entrenamiento activo -->
<section id="screen-workout" class="screen">
  <header class="screenhead">
    <button class="btn icon" onclick="closeWorkout()" title="Minimizar"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 9l7 7 7-7"/></svg></button>
    <div class="wk-head">
      <div id="wk-title"></div>
      <div id="wk-elapsed" class="muted small"></div>
    </div>
    <button class="btn primary" onclick="finishWorkout()">Finalizar</button>
  </header>
  <div id="wk-body" class="screenbody"></div>
</section>

<!-- Pantalla: detalle de ejercicio -->
<section id="screen-exdetail" class="screen">
  <header class="screenhead">
    <button class="btn icon" onclick="closeScreen('screen-exdetail')"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></button>
    <div class="wk-head"><div id="exd-title"></div></div>
    <span class="sp44"></span>
  </header>
  <div id="exd-body" class="screenbody"></div>
</section>

<!-- Barra de descanso -->
<div id="restbar" class="restbar hidden">
  <div class="restprog"><div id="rest-fill"></div></div>
  <div class="restrow">
    <div><div class="restlabel">Descanso</div><div id="rest-time">0:00</div></div>
    <div class="restbtns">
      <button class="btn ghost" onclick="restAdj(-15)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M5 12h14"/></svg>15s</button>
      <button class="btn ghost" onclick="restAdj(15)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>15s</button>
      <button class="btn primary" onclick="restSkip()">Saltar</button>
    </div>
  </div>
</div>

<!-- Banner entrenamiento activo (visible al minimizar) -->
<button id="active-banner" class="hidden" onclick="openWorkout()">
  <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M6 4l14 8-14 8z" fill="currentColor" stroke="none"/></svg> <span id="ab-name"></span> en curso — tocá para volver
</button>

<nav id="bottomnav">
  <button data-tab="rutinas" class="active" onclick="showTab('rutinas')"><span class="nicon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M1.5 9v6M6 5v14M18 5v14M22.5 9v6M6 12h12"/></svg></span><span>Rutinas</span></button>
  <button data-tab="progreso" onclick="showTab('progreso')"><span class="nicon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg></span><span>Progreso</span></button>
  <button data-tab="ajustes" onclick="showTab('ajustes')"><span class="nicon"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg></span><span>Ajustes</span></button>
</nav>

<div id="modal-root"></div>
<div id="toast" class="hidden"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
